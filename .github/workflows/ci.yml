name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    # Valeurs bidon : la CI ne parle jamais à un vrai backend (les tests
    # moquent Supabase, le build n'embarque que la chaîne). Elles évitent
    # que createClient() dans src/supabaseClient.js lève « supabaseUrl is
    # required » dès qu'un test importe la chaîne (ex. via errorReporter.js).
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
      VITE_VAPID_PUBLIC_KEY: placeholder-vapid-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 minimum : jsdom 26 (tests de composant) tire undici 7, qui
          # appelle webidl.util.markAsUncloneable — absent sous Node 20.
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build
