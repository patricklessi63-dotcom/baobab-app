name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 minimum : jsdom 26 (tests de composant) tire undici 7, qui
          # appelle webidl.util.markAsUncloneable — absent sous Node 20.
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        run: npm run build
