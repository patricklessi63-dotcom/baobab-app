apply plugin: 'com.android.application'

// Hôte des liens profonds (App Links) : lu dans src/config/publicOrigin.json, la
// SEULE source du domaine public (aussi utilisée par le code web/natif). Voir MOBILE.md.
def publicOrigin = new groovy.json.JsonSlurper().parse(file("../../src/config/publicOrigin.json")).origin
def deepLinkHost = new URI(publicOrigin).host

// versionCode (voir plus bas) : -PbaobabVersionCode=<n> (CI) ou 1 par défaut (build local).
def baobabVersionCode = (project.findProperty("baobabVersionCode") ?: "1").toString().toInteger()

android {
    namespace = "ca.baobab.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ca.baobab.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode : à incrémenter à CHAQUE envoi vers Google Play (voir MOBILE.md). La CI le
        // surcharge avec -PbaobabVersionCode=<n> (n° d'exécution du workflow) ; sans cette
        // propriété (build local), la valeur est 1.
        versionCode baobabVersionCode
        versionName "1.1.0"  // = "version" de package.json (voir MOBILE.md)
        manifestPlaceholders = [deepLinkHost: deepLinkHost]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Signature release : JAMAIS de clé dans le dépôt. Deux sources, par ordre de priorité :
    //  1. variables d'environnement ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
    //     ANDROID_KEY_PASSWORD (c'est ce que fait la CI : .github/workflows/android-build.yml) ;
    //  2. android/keystore.properties (ignoré par git) avec storeFile, storePassword, keyAlias, keyPassword.
    // Sans l'une ou l'autre, bundleRelease produit un AAB NON signé (Google Play le refusera).
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def signStoreFile = System.getenv("ANDROID_KEYSTORE_PATH") ?: keystoreProps.getProperty("storeFile")
    def signStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
    def signKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
    def signKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")
    def hasReleaseSigning = signStoreFile && signStorePassword && signKeyAlias && signKeyPassword
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(signStoreFile)
                storePassword signStorePassword
                keyAlias signKeyAlias
                keyPassword signKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase / FCM (notifications push) : le plugin google-services n'est appliqué QUE si
// android/app/google-services.json existe et n'est pas vide. Sans ce fichier, le build
// (et donc la CI) reste possible ; l'app tourne mais l'enregistrement push échoue avec un
// message clair. Le fichier est fourni par le propriétaire (console Firebase, voir MOBILE.md).
def servicesJson = file('google-services.json')
if (servicesJson.exists() && servicesJson.length() > 0) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle("google-services.json absent : notifications push natives désactivées dans ce build (voir MOBILE.md).")
}
