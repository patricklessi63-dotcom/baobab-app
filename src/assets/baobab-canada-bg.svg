<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08150F"/>
      <stop offset="35%" stop-color="#12321F"/>
      <stop offset="62%" stop-color="#584A2E"/>
      <stop offset="82%" stop-color="#C1613D"/>
      <stop offset="100%" stop-color="#E8A24C"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5C97A" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#D9A441" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#8FAE86" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8FAE86" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8FAE86" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#D9A441" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D9A441" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#D9A441" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#233A2A"/>
      <stop offset="100%" stop-color="#111F17"/>
    </linearGradient>
    <linearGradient id="savanna" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2E28"/>
      <stop offset="100%" stop-color="#100D14"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="url(#sky)"/>

  <!-- Halo solaire / lune -->
  <circle cx="1180" cy="330" r="260" fill="url(#sun)"/>
  <circle cx="1180" cy="330" r="72" fill="#F7E3B5" opacity="0.92"/>

  <!-- Etoiles -->
  <g fill="#F2E9DC">
    <circle cx="120" cy="90" r="1.6" opacity="0.8"/>
    <circle cx="260" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="400" cy="70" r="1.8" opacity="0.7"/>
    <circle cx="540" cy="180" r="1.3" opacity="0.5"/>
    <circle cx="700" cy="100" r="1.5" opacity="0.7"/>
    <circle cx="850" cy="60" r="1.2" opacity="0.6"/>
    <circle cx="180" cy="230" r="1.1" opacity="0.5"/>
    <circle cx="330" cy="260" r="1.4" opacity="0.6"/>
    <circle cx="60" cy="180" r="1.3" opacity="0.55"/>
    <circle cx="950" cy="140" r="1.2" opacity="0.5"/>
    <circle cx="1030" cy="220" r="1.1" opacity="0.45"/>
  </g>

  <!-- Aurores subtiles, clin d'oeil au Canada -->
  <path d="M0,120 C300,60 500,220 800,140 C1000,90 1200,180 1600,110 L1600,0 L0,0 Z" fill="url(#aurora1)"/>
  <path d="M0,220 C260,170 520,300 820,220 C1040,170 1260,260 1600,200 L1600,0 L0,0 Z" fill="url(#aurora2)"/>

  <!-- Montagnes enneigées lointaines, clin d'oeil au Canada -->
  <path d="M0,560 L140,430 L230,510 L360,380 L470,500 L620,420 L760,560 L900,470 L1040,560 L1200,440 L1350,540 L1600,460 L1600,600 L0,600 Z" fill="url(#mountain)" opacity="0.85"/>
  <path d="M230,510 L260,480 L300,520 Z M470,500 L500,470 L540,505 Z M900,470 L935,440 L975,478 Z M1200,440 L1235,410 L1275,448 Z" fill="#F2E9DC" opacity="0.5"/>

  <!-- Savane / plaine, clin d'oeil à l'Afrique -->
  <path d="M0,600 C300,560 500,640 800,590 C1050,550 1300,620 1600,580 L1600,1000 L0,1000 Z" fill="url(#savanna)"/>

  <!-- Herbes hautes -->
  <g stroke="#20161A" stroke-width="3" opacity="0.55" stroke-linecap="round">
    <path d="M60,980 C55,930 75,900 70,860"/>
    <path d="M100,990 C95,940 118,905 112,860"/>
    <path d="M1480,990 C1475,935 1500,900 1492,855"/>
    <path d="M1530,985 C1525,930 1550,898 1542,850"/>
    <path d="M1420,995 C1415,945 1438,908 1430,862"/>
  </g>

  <!-- Baobab, arbre central -->
  <g transform="translate(800,760)">
    <ellipse cx="0" cy="185" rx="230" ry="26" fill="#0A080B" opacity="0.45"/>
    <path d="M-18,180 C-30,90 -34,10 -14,-70 C-8,-95 8,-95 14,-70 C34,10 30,90 18,180 Z" fill="#1C1418"/>
    <path d="M-14,-40 C-70,-70 -110,-60 -150,-90 M-14,-40 C-90,-50 -140,-30 -190,-45 M14,-40 C70,-70 108,-58 150,-88 M14,-40 C92,-46 138,-26 186,-40 M0,-70 C-20,-130 -14,-170 -26,-215 M0,-70 C22,-128 16,-172 30,-214 M0,-60 C0,-120 0,-160 0,-205"
      fill="none" stroke="#1C1418" stroke-width="14" stroke-linecap="round"/>
    <g fill="#241A20">
      <ellipse cx="-190" cy="-92" rx="34" ry="16"/>
      <ellipse cx="-150" cy="-96" rx="30" ry="14"/>
      <ellipse cx="186" cy="-88" rx="34" ry="16"/>
      <ellipse cx="150" cy="-94" rx="30" ry="14"/>
      <ellipse cx="-26" cy="-222" rx="30" ry="15"/>
      <ellipse cx="30" cy="-220" rx="30" ry="15"/>
      <ellipse cx="0" cy="-212" rx="26" ry="14"/>
    </g>
  </g>

  <!-- Petits baobabs et acacia en arrière-plan -->
  <g fill="#140F13" opacity="0.75">
    <path d="M1220,900 L1226,830 L1214,830 Z"/>
    <ellipse cx="1220" cy="822" rx="26" ry="10"/>
    <path d="M300,920 L306,845 L294,845 Z"/>
    <ellipse cx="300" cy="836" rx="24" ry="9"/>
    <path d="M1080,940 C1080,900 1090,880 1080,850 M1080,900 C1050,890 1030,895 1010,880 M1080,895 C1110,888 1128,892 1148,878"
      fill="none" stroke="#140F13" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Feuille d'érable stylisée, clin d'oeil au Canada, flottant discrètement -->
  <g transform="translate(1310,680) scale(0.9) rotate(18)" fill="#C1613D" opacity="0.55">
    <path d="M0,-40 L8,-14 L34,-18 L16,2 L28,22 L4,12 L0,40 L-4,12 L-28,22 L-16,2 L-34,-18 L-8,-14 Z"/>
  </g>

  <!-- Oiseaux -->
  <g stroke="#F2E9DC" stroke-width="2.4" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M420,220 C430,210 440,210 448,222 C456,210 466,210 476,220"/>
    <path d="M500,260 C508,252 516,252 522,262 C528,252 536,252 544,260"/>
    <path d="M600,200 C608,192 616,192 622,202 C628,192 636,192 644,200"/>
  </g>
</svg>
