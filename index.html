<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover indispensable sur Safari iOS : sans lui, les
  variables env(safe-area-inset-*) valent toujours 0 (utilisées un peu
  partout dans l'app — nav du bas fixe, compositeur de messages, header
  sticky, pied des modales — voir SocialShell.jsx/ConversationPane.jsx/
  AppModals.jsx). Sans ce paramètre, ce padding de sécurité ne se
  déclenche jamais dans le navigateur (Safari réserve lui-même cette zone
  en dehors du viewport) ni de façon fiable en PWA installée sur l'écran
  d'accueil (manifest.webmanifest, display: standalone) — la nav du bas
  ou le champ de saisie peuvent alors chevaucher l'encoche/l'indicateur
  d'accueil sur un iPhone avec encoche ou Dynamic Island. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Baobab</title>
  <meta name="description" content="Baobab — l'application de rencontres et de communauté pour les immigrants au Canada. Trouve des rencontres, des communautés et des événements qui comprennent ton parcours." />
  <meta property="og:title" content="Baobab" />
  <meta property="og:description" content="L'application de rencontres et de communauté pour les immigrants au Canada." />
  <meta property="og:type" content="website" />
  <!-- URL absolue : og:image ne se résout pas de façon fiable en relatif chez
  tous les crawlers de partage social (Facebook/LinkedIn notamment). À mettre
  à jour si un domaine officiel remplace l'URL Vercel. -->
  <meta property="og:image" content="https://baobab-app-zeta.vercel.app/og-baobab.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Baobab : un baobab devant un soleil couchant, « Tes racines. Ta communauté. Ton prochain lien. »" />
  <meta property="og:url" content="https://baobab-app-zeta.vercel.app/" />
  <link rel="canonical" href="https://baobab-app-zeta.vercel.app/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Baobab" />
  <meta name="twitter:description" content="L'application de rencontres et de communauté pour les immigrants au Canada." />
  <meta name="twitter:image" content="https://baobab-app-zeta.vercel.app/og-baobab.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- manifest.webmanifest déclare display: standalone, mais iOS ignore
  cette propriété du manifest pour "Ajouter à l'écran d'accueil" sur de
  nombreuses versions encore répandues (support complet du manifest
  seulement depuis iOS 16.4) : sans apple-mobile-web-app-capable, l'app
  installée s'ouvrait comme un simple signet dans Safari (barre d'adresse
  et onglets visibles) au lieu d'une PWA plein écran. mobile-web-app-capable
  est l'équivalent non préfixé désormais reconnu par Chrome/Android, à
  déclarer en plus (jamais à la place, tant que d'anciens iOS circulent).
  apple-mobile-web-app-status-bar-style: la couleur de la barre de statut en
  mode standalone iOS n'est PAS pilotée par theme-color/manifest (spécifique
  à Apple) — "black" plutôt que le "default" gris clair pour rester cohérent
  avec la palette vert foncé/or-noir de l'app, sans passer en
  "black-translucent" (qui ferait dessiner le contenu sous la barre de
  statut : plusieurs écrans plein écran, ex. OnboardingWizard.jsx, n'ont pas
  de padding-top env(safe-area-inset-top) et seraient alors rognés par
  l'encoche/Dynamic Island). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Baobab" />
  <!-- Deux balises plutôt qu'une seule (support natif Safari/Chrome des
  attributs media sur theme-color, pas besoin de JS) — la barre d'état du
  PWA/onglet suit désormais la palette or/noir en mode sombre système,
  au lieu de rester figée sur le vert du mode clair. -->
  <meta name="theme-color" content="#F3EEE4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#060B09" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ======================================================================
    Identité « Baobab Horizon » (nuit verte, horizon de savane au coucher du
    soleil) appliquée à TOUTE l'app : mêmes jetons --hz-* que la page d'accueil
    (src/styles/horizon-tokens.css), exposés ici sous les noms --bb-* que
    l'ensemble des écrans utilise déjà. Le thème sombre est l'identité de
    référence (Horizon) ; le thème clair en est la version « ivoire » : mêmes
    verts, mêmes accents braise/corail. Contrastes WCAG vérifiés (voir les
    commentaires de chaque jeton) : texte >= 4.5:1 sur bg, surface, surface-2.
    ====================================================================== */
    :root {
      --bb-indigo: #14432A;
      --bb-indigo-deep: #0D2E1C;
      --bb-ochre: #F2A33A;
      --bb-sand: #F3EEE4;
      --bb-ink: #0F2B21;
      --bb-radius-lg: 22px;
      --bb-radius-md: 14px;
      --bb-radius-sm: 11px;
      --bb-ease: cubic-bezier(.4,0,.2,1);
      --bb-ease-out: cubic-bezier(.2,.8,.2,1);

      /* Polices : Syne (titres, très large -> graisse 700 maximum, tailles
      modérées), Manrope (texte), IBM Plex Mono (étiquettes). Replis système
      robustes si Google Fonts est injoignable. */
      --bb-font-display: "Syne", "Arial Black", system-ui, -apple-system, "Segoe UI", sans-serif;
      --bb-font-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      /* Titres courants (modales, cartes, étapes) : Manrope gras. Syne est
      réservée aux GRANDS titres (.bb-display) et au nom de marque (.bb-wordmark) :
      à petite taille elle paraît étirée. */
      --bb-font-title: var(--bb-font-body);
      --bb-font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

      /* Couleurs de marque Horizon, identiques dans les deux thèmes. */
      --bb-seve: #1F7A5A;
      --bb-braise: #F2A33A;
      --bb-corail: #EA5F4B;
      --bb-signal: #62F0BA;
      --bb-leaf: #1F7A5A;
      --bb-leaf-deep: #185C43;
      /* Texte posé sur un aplat braise/corail (CTA) : 9.1:1 sur braise, 5.7:1 sur corail. */
      --bb-on-sun: #1A0D06;

      /* --- Thème CLAIR (« ivoire ») : ivoire chaud, texte canopée. --- */
      --bb-bg: #F3EEE4;
      --bb-surface: #FFFDF8;
      --bb-surface-rgb: 255,253,248;
      --bb-surface-2: #F2EEE4;
      --bb-text: #0F2B21;
      --bb-text-rgb: 15,43,33;
      --bb-body-text: #17362B;
      --bb-muted: rgba(15,43,33,0.74);
      --bb-text-faint: rgba(15,43,33,0.66);
      --bb-border: rgba(15,43,33,0.13);
      --bb-ink-rgb: 15,43,33;
      /* Ancienne variante « FIXE » pour les écrans à fond toujours clair
      (onboarding, édition de profil...). Ces écrans suivent désormais le thème
      comme le reste de l'app : la valeur est donc redéfinie en sombre. */
      --bb-ink-rgb-static: 15,43,33;
      /* Accent d'interface (focus, puces actives, liens vifs) : vert profond
      lisible sur ivoire (7.9:1 sur blanc) ; remplacé par le « signal » en sombre. */
      --bb-accent: #185C43;
      --bb-accent-rgb: 24,92,67;
      --bb-gold-1: #F2A33A;
      --bb-gold-2: #EA5F4B;
      --bb-coral-text: #C0392B;
      --bb-gold-text: #8A5E0A;
      --bb-leaf-light: #3FB37E;
      --bb-shadow-sm: 0 1px 2px rgba(15,43,33,0.07);
      --bb-shadow-md: 0 8px 24px -8px rgba(15,43,33,0.14);
      --bb-shadow-lg: 0 18px 44px -12px rgba(15,43,33,0.24);
      /* Halos d'ambiance du fond (voir .bb-horizon-bg) — doux en clair. */
      --bb-glow-a: rgba(31,122,90,0.10);
      --bb-glow-b: rgba(242,163,58,0.12);
      /* Contrôles natifs (listes déroulantes, calendriers, barres de défilement) : clairs avec le thème clair. */
      color-scheme: light;
    }
    /* --- Thème SOMBRE (Horizon) : nuit verte, ivoire, signal. Mêmes valeurs
    pour le réglage « Système » (media query) et le choix manuel. --- */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bb-bg: #060B09;
        --bb-surface: #0B1511;
        --bb-surface-rgb: 11,21,17;
        --bb-surface-2: #0F2219;
        --bb-text: #F3EEE4;
        --bb-text-rgb: 243,238,228;
        --bb-body-text: #F3EEE4;
        /* Ivoire .68 = 7.3:1 à 8:1 ; .56 = 5.4:1 à 5.7:1 (>= 4.5:1 partout). */
        --bb-muted: rgba(243,238,228,0.68);
        --bb-text-faint: rgba(243,238,228,0.56);
        --bb-border: rgba(243,238,228,0.14);
        --bb-ink-rgb: 243,238,228;
        --bb-ink-rgb-static: 243,238,228;
        --bb-accent: #62F0BA;
        --bb-accent-rgb: 98,240,186;
        --bb-coral-text: #EF7565;
        --bb-gold-text: #F2A33A;
        --bb-leaf-light: #62F0BA;
        --bb-shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
        --bb-shadow-md: 0 12px 32px -12px rgba(0,0,0,0.7);
        --bb-shadow-lg: 0 24px 56px -16px rgba(0,0,0,0.8);
        --bb-glow-a: rgba(31,122,90,0.22);
        --bb-glow-b: rgba(242,163,58,0.09);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bb-bg: #060B09;
      --bb-surface: #0B1511;
      --bb-surface-rgb: 11,21,17;
      --bb-surface-2: #0F2219;
      --bb-text: #F3EEE4;
      --bb-text-rgb: 243,238,228;
      --bb-body-text: #F3EEE4;
      --bb-muted: rgba(243,238,228,0.68);
      --bb-text-faint: rgba(243,238,228,0.56);
      --bb-border: rgba(243,238,228,0.14);
      --bb-ink-rgb: 243,238,228;
      --bb-ink-rgb-static: 243,238,228;
      --bb-accent: #62F0BA;
      --bb-accent-rgb: 98,240,186;
      --bb-coral-text: #EF7565;
      --bb-gold-text: #F2A33A;
      --bb-leaf-light: #62F0BA;
      --bb-shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
      --bb-shadow-md: 0 12px 32px -12px rgba(0,0,0,0.7);
      --bb-shadow-lg: 0 24px 56px -16px rgba(0,0,0,0.8);
      --bb-glow-a: rgba(31,122,90,0.22);
      --bb-glow-b: rgba(242,163,58,0.09);
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body { margin: 0; background: var(--bb-bg); color: var(--bb-text); font-family: var(--bb-font-body); }
    /* Titres courants : Manrope (aucun effet étiré), césure équilibrée. Syne
    n'est utilisée que pour .bb-display (grands titres, graisse 700 au plus,
    !important pour résister à font-black/font-extrabold) et .bb-wordmark. */
    h1, h2, h3, h4 { font-family: var(--bb-font-title); letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: break-word; }
    .bb-display { font-family: var(--bb-font-display); font-weight: 700 !important; letter-spacing: -0.02em; line-height: 1.12; text-wrap: balance; overflow-wrap: break-word; }
    .bb-wordmark { font-family: var(--bb-font-display); font-weight: 800; letter-spacing: 0.18em; }
    .bb-mono { font-family: var(--bb-font-mono); letter-spacing: 0.06em; }
    .bb-eyebrow { font-family: var(--bb-font-mono); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bb-accent); }
    :focus-visible { outline: 2px solid var(--bb-accent); outline-offset: 2px; }

    /* Fond « horizon » de l'app connectée : deux halos (sève en haut à droite,
    braise à gauche) qui respirent lentement, plus un balayage lumineux très
    discret. Calque FIXE derrière le contenu (z-index négatif), purement CSS :
    aucun coût JavaScript. Animations coupées par « Réduire les animations ». */
    .bb-horizon-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--bb-bg); }
    .bb-horizon-bg::before, .bb-horizon-bg::after { content: ""; position: absolute; border-radius: 50%; filter: blur(40px); }
    .bb-horizon-bg::before { right: -20%; top: -18%; width: 70vmax; height: 70vmax; background: radial-gradient(circle, var(--bb-glow-a), transparent 68%); animation: bbBreathe 9s ease-in-out infinite; }
    .bb-horizon-bg::after { left: -25%; top: 38%; width: 60vmax; height: 60vmax; background: radial-gradient(circle, var(--bb-glow-b), transparent 70%); animation: bbBreathe 12s ease-in-out -4s infinite; }
    .bb-horizon-bg > i { position: absolute; left: 0; right: 0; top: -40%; height: 40%; background: linear-gradient(180deg, transparent, rgba(var(--bb-accent-rgb), .045) 70%, transparent); animation: bbScan 14s linear infinite; }
    @keyframes bbBreathe { 50% { transform: scale(1.1); opacity: .78; } }
    @keyframes bbScan { to { transform: translateY(350%); } }
    /* Entrée en douceur (contenu visible par défaut : l'animation part de l'état final). */
    .bb-rise { animation: bbRise .7s var(--bb-ease-out) backwards; }
    @keyframes bbRise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    /* Soleil qui défile dans un texte (mot-clé de titre, chiffre clé). */
    .bb-sun-text { background: linear-gradient(100deg, var(--bb-braise), var(--bb-corail) 45%, var(--bb-braise) 90%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: bbSun 7s linear infinite; }
    @keyframes bbSun { to { background-position: 200% 0; } }
    /* Préférence « Réduire les animations » (réglage de l'app, voir useReduceMotion) :
    s'ajoute à prefers-reduced-motion, ne le contredit jamais. */
    :root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after { animation: none !important; transition: none !important; }

    .bb-card {
      background: var(--bb-surface);
      border: 1px solid var(--bb-border);
      border-radius: var(--bb-radius-lg);
      box-shadow: var(--bb-shadow-md);
      transition: border-color .25s var(--bb-ease), box-shadow .25s var(--bb-ease), transform .25s var(--bb-ease);
    }
    @media (hover: hover) {
      .bb-card:hover { border-color: rgba(var(--bb-accent-rgb), .38); }
    }

    .bb-input {
      display: block;
      border: 1px solid var(--bb-border);
      border-radius: var(--bb-radius-sm);
      padding: 12px 14px;
      font-size: 16px !important; /* évite le zoom auto de Safari iOS au focus (déclenché sous 16px) ; !important nécessaire car la feuille Tailwind (build PostCSS via postcss.config.js, importée dans main.jsx) se charge après ce style inline et une classe comme text-sm gagnerait sinon la cascade */
      background: var(--bb-surface);
      color: var(--bb-text);
      transition: border-color .15s var(--bb-ease), box-shadow .15s var(--bb-ease);
    }
    .bb-input::placeholder { color: var(--bb-muted); }
    .bb-input:focus {
      outline: none;
      border-color: var(--bb-accent);
      box-shadow: 0 0 0 3px rgba(var(--bb-accent-rgb), 0.18);
    }

    .bb-btn { transition: transform .12s var(--bb-ease), box-shadow .18s var(--bb-ease), background .15s var(--bb-ease), opacity .15s var(--bb-ease); }
    .bb-btn:active { transform: scale(0.96); }
    .bb-btn:disabled { opacity: .55; cursor: not-allowed; }

    .bb-btn-primary { background: var(--bb-leaf-deep); color: #fff; box-shadow: var(--bb-shadow-sm); }
    .bb-btn-primary:hover:not(:disabled) { background: var(--bb-leaf); box-shadow: var(--bb-shadow-md); }

    .bb-btn-heart { background: var(--bb-leaf); color: #fff; box-shadow: 0 8px 20px rgba(31,122,90,0.35); }
    .bb-btn-heart:hover:not(:disabled) { background: var(--bb-leaf-deep); box-shadow: 0 10px 24px rgba(31,122,90,0.45); transform: translateY(-1px); }

    /* Refonte or/noir — bouton d'action principal (Se rencontrer, Publier,
    Envoyer...), dégradé à deux arrêts au lieu d'un aplat. Texte toujours
    très sombre dessus (contraste), peu importe le thème. */
    .bb-btn-gold { background: linear-gradient(100deg, var(--bb-gold-1), var(--bb-gold-2)); color: var(--bb-on-sun); box-shadow: 0 10px 28px -10px rgba(234,95,75,0.7); }
    .bb-btn-gold:hover:not(:disabled) { box-shadow: 0 14px 34px -10px rgba(234,95,75,0.85); transform: translateY(-2px); }

    /* Bouton d'ENVOI de la messagerie — vert "leaf", volontairement distinct
    des CTA or (bb-btn-gold) et des alertes corail (bb-btn-danger). Aplat
    #1F7A5A + texte blanc = ~5.3:1 (WCAG AA texte normal OK) ; survol
    #185C43 = ~7.9:1. Valeur FIXE dans les deux thèmes (couleur de marque). */
    .bb-btn-leaf { background: var(--bb-leaf); color: #fff; box-shadow: 0 8px 20px rgba(31,122,90,0.3); transition: transform .12s var(--bb-ease), box-shadow .18s var(--bb-ease), background .15s var(--bb-ease), opacity .15s var(--bb-ease); }
    .bb-btn-leaf:hover:not(:disabled) { background: var(--bb-leaf-deep); box-shadow: 0 10px 24px rgba(31,122,90,0.4); transform: translateY(-1px); }
    .bb-btn-leaf:active:not(:disabled) { transform: scale(0.96); }
    .bb-btn-leaf:disabled { opacity: .55; cursor: not-allowed; }

    /* Envoi d'un message (Messages 4.0) — micro-décollage au clic : le bouton
    pulse brièvement pendant que l'icône glisse/grossit vers la droite, comme
    un avion en papier qui part. Purement visuel (~180ms) : l'appel réseau
    part immédiatement, la classe est retirée juste après. prefers-reduced-motion
    est couvert par la règle globale en bas de ce fichier. */
    .bb-send-pop { animation: bbSendPop .18s var(--bb-ease); }
    @keyframes bbSendPop { 0% { transform: scale(1); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .bb-send-pop svg { animation: bbSendLift .18s var(--bb-ease); }
    @keyframes bbSendLift { 0% { transform: translateX(0) scale(1); } 55% { transform: translateX(3px) scale(1.08); } 100% { transform: translateX(0) scale(1); } }

    /* Barre de saisie de la messagerie (Messages 4.0) — « barre flottante »
    détachée du fil : fond surface (déjà posé en classe Tailwind) + fine
    ombre portée vers le haut. */
    .bb-composer-bar { box-shadow: 0 -8px 24px -12px rgba(var(--bb-text-rgb), .22); }

    /* Textarea du compositeur — anneau vert doux qui apparaît en transition
    au focus, au lieu d'un outline brut. Sert aussi d'indicateur de focus
    clavier (bordure + halo bien visibles). */
    .bb-composer-input { border: 1px solid transparent; transition: border-color .16s var(--bb-ease), box-shadow .16s var(--bb-ease); }
    .bb-composer-input:focus, .bb-composer-input:focus-visible { outline: none; border-color: var(--bb-leaf); box-shadow: 0 0 0 3px rgba(31,122,90,0.16); }

    /* Réaction posée sur un message (Messages 4.0) — petit « pop » d'apparition
    (~250ms) sur la pastille emoji, joué une seule fois au montage de la
    pastille. prefers-reduced-motion : couvert par la règle globale. */
    .bb-reaction-pop { animation: bbReactionPop .25s var(--bb-ease); }
    @keyframes bbReactionPop { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }

    /* Bouton d'action à fond corail plein + libellé texte (Confirmer, Traiter,
    Bloquer, Envoyer un signalement, Aperçu d'une story...). L'aplat d'identité
    #E56B5D ne donne que 3.19:1 avec du texte blanc — échec WCAG AA pour du
    texte < 18.66px gras. On assombrit le fond à #C0392B (teinte corail
    conservée) : #fff dessus = 5.44:1. Valeur FIXE dans les deux thèmes : un
    bouton destructeur reste un rouge saturé, et le jeton --bb-coral-text
    rebascule vers #E56B5D en sombre (donc inutilisable ici). Les aplats/
    dégradés/bordures/icônes corail SANS texte dessus ne sont pas concernés et
    gardent C.coral. */
    .bb-btn-danger { background: #C0392B; color: #fff; box-shadow: 0 8px 20px rgba(192,57,43,0.28); transition: transform .12s var(--bb-ease), box-shadow .18s var(--bb-ease), background .15s var(--bb-ease), opacity .15s var(--bb-ease); }
    .bb-btn-danger:hover:not(:disabled) { background: #A93226; box-shadow: 0 10px 24px rgba(192,57,43,0.38); transform: translateY(-1px); }
    .bb-btn-danger:active:not(:disabled) { transform: scale(0.98); }
    .bb-btn-danger:disabled { opacity: .5; cursor: not-allowed; }
    .bb-btn-danger:focus-visible { outline: 2px solid var(--bb-text); outline-offset: 2px; }

    .bb-btn-pass { background: var(--bb-surface); border: 1px solid var(--bb-border); color: var(--bb-text); }
    .bb-btn-pass:hover:not(:disabled) { border-color: rgba(var(--bb-ink-rgb), 0.32); background: rgba(var(--bb-ink-rgb), 0.05); }

    .bb-pill {
      border: 1px solid var(--bb-border);
      color: var(--bb-text);
      transition: all .15s var(--bb-ease);
    }
    .bb-pill:hover { border-color: rgba(var(--bb-accent-rgb), 0.55); }
    /* Puce active : même langage que les zones de la page d'accueil (bordure et
    voile d'accent), lisible dans les deux thèmes. */
    .bb-pill-active { background: rgba(var(--bb-accent-rgb), 0.14); color: var(--bb-text); border-color: var(--bb-accent); box-shadow: 0 0 0 1px rgba(var(--bb-accent-rgb), .25); }

    .bb-badge {
      background: var(--bb-bg);
      border: 1px solid var(--bb-border);
      color: var(--bb-text);
      font-weight: 600;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 999px;
      letter-spacing: 0.01em;
    }

    .bb-fade-in { animation: bbFadeIn .28s var(--bb-ease); }
    @keyframes bbFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Pastille « en ligne » des avatars (messagerie, cartes de conversation) —
    respiration douce pour signaler la présence en direct. prefers-reduced-motion
    est couvert par la règle globale en bas de ce fichier. */
    .bb-online-pulse { animation: bbOnlinePulse 2s ease-in-out infinite; }
    @keyframes bbOnlinePulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: .82; } }

    /* --- Prompt bonus "Verre dépoli, animations et onglets" ---
    Cascade fondu-décalé pour titres/sous-titres d'un écran qui s'ouvre :
    chaque enfant direct de .bb-stagger apparaît avec un léger décalage
    dans le temps plutôt que tous d'un coup. prefers-reduced-motion est
    déjà couvert par la règle globale tout en bas de ce fichier. */
    .bb-stagger > * { animation: bbFadeIn .65s var(--bb-ease) backwards; }
    .bb-stagger > *:nth-child(1) { animation-delay: .04s; }
    .bb-stagger > *:nth-child(2) { animation-delay: .14s; }
    .bb-stagger > *:nth-child(3) { animation-delay: .24s; }
    .bb-stagger > *:nth-child(4) { animation-delay: .34s; }
    .bb-stagger > *:nth-child(n+5) { animation-delay: .40s; }

    /* Verre dépoli réactif au thème (utilise --bb-surface-rgb, déjà défini
    plus haut pour clair/sombre) — pour la navigation principale et les
    onglets secondaires, pas pour toute l'app (coût du backdrop-filter). */
    .bb-glass-nav {
      background: rgba(var(--bb-surface-rgb), .74);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-color: var(--bb-border);
    }
    .bb-tab-active {
      position: relative;
      transform: translateY(-1px);
      transition: transform .2s var(--bb-ease), background .2s var(--bb-ease), color .2s var(--bb-ease);
    }
    .bb-tab-active::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      background: radial-gradient(circle, rgba(var(--bb-accent-rgb), .26), transparent 72%);
      z-index: -1;
      animation: bbTabGlow .35s var(--bb-ease) both;
    }
    @keyframes bbTabGlow { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

    /* Zoom lent continu pour les visuels de mise en avant (carte de
    découverte, bannière) — jamais sur une image qu'on doit lire finement. */
    .bb-kenburns { animation: bbKenBurns 18s ease-in-out infinite alternate; }
    @keyframes bbKenBurns { from { transform: scale(1); } to { transform: scale(1.06); } }

    /* Chargement d'image : balayage lumineux au lieu d'un cadre gris fixe,
    puis fondu d'apparition une fois chargée. */
    .bb-img-loading {
      background: linear-gradient(100deg, rgba(var(--bb-text-rgb),.05) 30%, rgba(var(--bb-text-rgb),.12) 50%, rgba(var(--bb-text-rgb),.05) 70%);
      background-size: 200% 100%;
      animation: bbShimmer 1.5s ease-in-out infinite;
    }
    @keyframes bbShimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
    .bb-img-fade { opacity: 0; transition: opacity .45s var(--bb-ease); }
    .bb-img-fade.bb-loaded { opacity: 1; }

    .bb-icon-btn { transition: background .15s var(--bb-ease), transform .12s var(--bb-ease); }
    .bb-icon-btn:hover { background: rgba(var(--bb-ink-rgb), 0.14) !important; }
    .bb-icon-btn:active { transform: scale(0.94); }

    .bb-nav-btn { transition: background .15s var(--bb-ease), color .15s var(--bb-ease), transform .12s var(--bb-ease); }
    .bb-nav-btn:hover { background: rgba(var(--bb-ink-rgb), 0.07) !important; }
    .bb-nav-btn:active { transform: scale(0.95); }

    /* Repère lumineux de l'onglet actif (barre du bas) et pastille de marque de
    l'en-tête — mêmes accents « signal » que la page d'accueil Horizon. */
    .bb-nav-pip { position: absolute; top: 0; left: 50%; width: 28px; height: 3px; margin-left: -14px; border-radius: 0 0 4px 4px; background: var(--bb-accent); box-shadow: 0 6px 18px 2px rgba(var(--bb-accent-rgb), .5); animation: bbPip .35s var(--bb-ease-out) both; }
    @keyframes bbPip { from { transform: scaleX(.2); opacity: 0; } to { transform: none; opacity: 1; } }
    .bb-brand-chip { border: 1px solid rgba(98,240,186,.35); box-shadow: 0 0 22px -6px rgba(98,240,186,.45); }
    header.bb-glass { box-shadow: 0 12px 32px -20px rgba(var(--bb-accent-rgb), .5); }
    /* États vides : pastille d'icône qui émet une onde « signal ». */
    .bb-empty-ring { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(var(--bb-accent-rgb), .4); background: rgba(var(--bb-accent-rgb), .08); animation: bbRing 2.6s ease-out infinite; }
    @keyframes bbRing { from { box-shadow: 0 0 0 0 rgba(var(--bb-accent-rgb), .35); } to { box-shadow: 0 0 0 18px rgba(var(--bb-accent-rgb), 0); } }
    /* Squelettes de chargement : balayage lumineux « signal » (au lieu d'un simple clignotement). */
    .bb-skel * { background-image: linear-gradient(100deg, transparent 30%, rgba(var(--bb-accent-rgb), .16) 50%, transparent 70%) !important; background-size: 200% 100%; animation: bbShimmer 1.6s ease-in-out infinite; }

    .bb-scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .bb-scroll-x::-webkit-scrollbar { display: none; }

    ::selection { background: rgba(var(--bb-accent-rgb), 0.3); }

    /* Onglet en arrière-plan : on gèle toutes les animations CSS. Le contenu
    n'est pas visible de toute façon, et les animations de fond en boucle
    (dérive Ken Burns .bb-app-bg / .bb-generic-bg, zoom lent .bb-kenburns,
    décor animé de l'écran de connexion, dégradés/particules) continuaient
    sinon à consommer du CPU et de la batterie pour rien — surtout sur mobile.
    La classe est posée/retirée sur <html> par le script visibilitychange
    ci-dessous. Reprise native sans saut au retour : animation-play-state
    reprend exactement où il s'était arrêté. prefers-reduced-motion (règle
    ci-dessous) reste prioritaire et inchangé. */
    :root.bb-paused, :root.bb-paused *, :root.bb-paused *::before, :root.bb-paused *::after {
      animation-play-state: paused !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
  <!-- ATTENTION : la Content-Security-Policy de production (vercel.json,
  en-tête script-src) n'autorise QUE les 2 scripts inline suivants, chacun
  identifié par son hash SHA-256 exact — pas de 'unsafe-inline'. Modifier ne
  serait-ce qu'un espace ou un commentaire À L'INTÉRIEUR d'un de ces deux
  blocs change son hash et le fait bloquer SILENCIEUSEMENT en production
  (bug vécu le 2026-09-11 : la pause d'animation en arrière-plan ne
  s'exécutait jamais en prod, seulement en dev où cet en-tête n'est pas
  envoyé — l'erreur n'apparaît que dans la console du navigateur). Après
  toute édition d'un de ces 2 blocs : `npm run build`, recalculer son hash
  SHA-256/base64 depuis dist/index.html, et mettre à jour script-src dans
  vercel.json avec la nouvelle valeur. -->
  <script>
    // Applique le thème AVANT le premier rendu (évite le flash). Par défaut
    // (aucune préférence enregistrée) : sombre, l'identité Baobab Horizon
    // (même rendu que la page d'accueil) — "Clair" et "Système" restent des
    // choix explicites dans les réglages ; avec "Système" aucun attribut
    // n'est posé et la media query @media (prefers-color-scheme: dark)
    // ci-dessus prend le relais. Pose aussi data-motion="reduce" si
    // l'utilisateur a choisi "Réduire les animations".
    try {
      var t = localStorage.getItem("bb-theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      else if (t !== "system") document.documentElement.setAttribute("data-theme", "dark");
      if (localStorage.getItem("bb-reduce-motion") === "1") document.documentElement.setAttribute("data-motion", "reduce");
    } catch (e) {}
  </script>
  <script>
    // Met en pause les animations CSS quand l'onglet passe en arrière-plan
    // (voir la règle .bb-paused dans le <style> ci-dessus). Gain surtout
    // mobile : le fond animé en boucle infinie ne tournait plus dans le vide.
    (function () {
      var syncPaused = function () {
        document.documentElement.classList.toggle("bb-paused", document.hidden);
      };
      document.addEventListener("visibilitychange", syncPaused);
      syncPaused();
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
